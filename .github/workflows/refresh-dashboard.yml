name: Refresh dashboard

on:
  schedule:
    # Target: 12 AM, 6 AM, 12 PM, 6 PM Eastern. Cron is UTC, so both the EDT hours (4,10,16,22) and the
    # EST hours (5,11,17,23) are listed; tools/should_run.py lets only one of each pair do the work.
    - cron: "5 4,5,10,11,16,17,22,23 * * *"
  workflow_dispatch:

permissions:
  contents: write      # commit refreshed data files
  issues: write        # open an issue when a source breaks
  pages: write         # deploy the page
  id-token: write

concurrency:
  group: dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      ran: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v5

      - name: Gate (skip duplicate or too-early scheduled runs)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "run=$(python3 tools/should_run.py data/dashboard.json)" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Offline tests (guards code changes; no network or keys needed)
        if: steps.gate.outputs.run == 'true'
        run: python -m pytest -q

      - name: Fetch data (fails soft per source)
        if: steps.gate.outputs.run == 'true'
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          MBTA_API_KEY: ${{ secrets.MBTA_API_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          MASSDOT_CWZ_URL: ${{ secrets.MASSDOT_CWZ_URL }}
          MASSDOT_CWZ_KEY: ${{ secrets.MASSDOT_CWZ_KEY }}
          MASSDOT_CWZ_AUTH: ${{ vars.MASSDOT_CWZ_AUTH }}
          MASSDOT_EVENTS_URL: ${{ vars.MASSDOT_EVENTS_URL }}
          CRIME_ARCGIS_URL: ${{ vars.CRIME_ARCGIS_URL }}
          CRIME_ARCGIS_DATE_FIELD: ${{ vars.CRIME_ARCGIS_DATE_FIELD }}
          MBTA_ROUTE_TYPES: ${{ vars.MBTA_ROUTE_TYPES }}
        run: python -m src.build_data

      - name: Render and validate page (a failed validation keeps the previous page live)
        if: steps.gate.outputs.run == 'true'
        run: python -m src.render

      - name: Commit refreshed data (history = archive; also lets stale sections keep last good data)
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Open or update an issue if any section is stale or unavailable
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -qE "STALE|UNAVAILABLE" data/run_summary.md; then
            gh label create dashboard-refresh --color FBCA04 --force || true
            n=$(gh issue list --state open --label dashboard-refresh --json number --jq '.[0].number')
            if [ -n "$n" ]; then gh issue comment "$n" --body-file data/run_summary.md
            else gh issue create --label dashboard-refresh --title "Dashboard refresh: some sections need attention" --body-file data/run_summary.md; fi
          fi

      - uses: actions/upload-pages-artifact@v5
        if: steps.gate.outputs.run == 'true'
        with:
          path: dist

      - name: Alert if the workflow itself failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create dashboard-refresh --color FBCA04 --force || true
          gh issue create --label dashboard-refresh --title "Dashboard workflow failed" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The previously deployed page is still live."

  deploy:
    needs: refresh
    if: needs.refresh.outputs.ran == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
